<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg-lion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="mane-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="crown-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="glow-lion" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#facc15" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="64" cy="64" r="60" fill="url(#bg-lion)" stroke="#facc15" stroke-width="3.5" filter="url(#glow-lion)"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="#fef08a" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.75"/>

  <!-- Lion Face & Mane -->
  <g transform="translate(64, 65)">
    <!-- Mighty Mane Tufts -->
    <path d="M0 -34 Q-14 -32 -22 -24 Q-34 -32 -32 -16 Q-42 -12 -38 4 Q-46 16 -34 26 Q-32 38 -18 36 Q-12 44 0 42 Q12 44 18 36 Q32 38 34 26 Q46 16 38 4 Q42 -12 32 -16 Q34 -32 22 -24 Q14 -32 0 -34 Z" fill="url(#mane-grad)" stroke="#451a03" stroke-width="2"/>

    <!-- Round Ears -->
    <circle cx="-20" cy="-16" r="7" fill="#f59e0b" stroke="#451a03" stroke-width="1.5"/>
    <circle cx="20" cy="-16" r="7" fill="#f59e0b" stroke="#451a03" stroke-width="1.5"/>
    <circle cx="-20" cy="-16" r="4" fill="#fbbf24"/>
    <circle cx="20" cy="-16" r="4" fill="#fbbf24"/>

    <!-- Face Base -->
    <ellipse cx="0" cy="2" rx="20" ry="18" fill="#f59e0b" stroke="#451a03" stroke-width="1.8"/>

    <!-- Royal Battle Coronet / Crown -->
    <path d="M-14 -20 L-18 -32 L-7 -25 L0 -35 L7 -25 L18 -32 L14 -20 Z" fill="url(#crown-gold)" stroke="#78350f" stroke-width="1.5"/>
    <circle cx="0" cy="-28" r="2" fill="#ef4444"/>
    <circle cx="-11" cy="-25" r="1.5" fill="#3b82f6"/>
    <circle cx="11" cy="-25" r="1.5" fill="#3b82f6"/>

    <!-- White Snout Area -->
    <ellipse cx="0" cy="10" rx="11" ry="8" fill="#fef3c7" stroke="#451a03" stroke-width="1.2"/>
    <path d="M-4 5 L4 5 L0 9 Z" fill="#451a03"/>
    <line x1="0" y1="9" x2="0" y2="13" stroke="#451a03" stroke-width="1.5"/>
    <path d="M-5 13 Q0 16 5 13" stroke="#451a03" stroke-width="1.5" fill="none"/>

    <!-- Noble Amber Eyes -->
    <ellipse cx="-8" cy="-2" rx="3.5" ry="3" fill="#ffffff" stroke="#451a03" stroke-width="1.2"/>
    <ellipse cx="8" cy="-2" rx="3.5" ry="3" fill="#ffffff" stroke="#451a03" stroke-width="1.2"/>
    <circle cx="-8" cy="-2" r="2" fill="#b45309"/>
    <circle cx="8" cy="-2" r="2" fill="#b45309"/>
    <circle cx="-8.5" cy="-2.5" r="0.8" fill="#ffffff"/>
    <circle cx="7.5" cy="-2.5" r="0.8" fill="#ffffff"/>
  </g>
</svg>
