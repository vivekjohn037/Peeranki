<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg-tiger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <filter id="glow-tiger" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#fb923c" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="64" cy="64" r="60" fill="url(#bg-tiger)" stroke="#fb923c" stroke-width="3.5" filter="url(#glow-tiger)"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="#fcd34d" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.75"/>

  <!-- Tiger Face -->
  <g transform="translate(64, 64)">
    <!-- Ears -->
    <path d="M-28 -28 Q-38 -12 -22 -14 Z" fill="#ea580c" stroke="#18181b" stroke-width="2"/>
    <path d="M28 -28 Q38 -12 22 -14 Z" fill="#ea580c" stroke="#18181b" stroke-width="2"/>
    <path d="M-27 -25 Q-32 -16 -24 -17 Z" fill="#ffffff"/>
    <path d="M27 -25 Q32 -16 24 -17 Z" fill="#ffffff"/>

    <!-- Head Contour -->
    <ellipse cx="0" cy="0" rx="28" ry="25" fill="#f97316" stroke="#18181b" stroke-width="2.2"/>
    <!-- Cheek ruffs -->
    <path d="M-28 4 Q-36 12 -26 18 Q-34 26 -20 25 Z" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
    <path d="M28 4 Q36 12 26 18 Q34 26 20 25 Z" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>

    <!-- Forehead Stripes -->
    <path d="M0 -22 L0 -10 M-6 -18 L-1 -12 M6 -18 L1 -12" stroke="#18181b" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M-14 -12 Q-4 -8 0 -8 Q4 -8 14 -12" stroke="#18181b" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Cheek Stripes -->
    <path d="M-24 -4 L-15 0 M-26 5 L-16 6" stroke="#18181b" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M24 -4 L15 0 M26 5 L16 6" stroke="#18181b" stroke-width="2.2" stroke-linecap="round"/>

    <!-- White Snout -->
    <ellipse cx="0" cy="11" rx="14" ry="10" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
    <!-- Black Nose -->
    <path d="M-5 5 L5 5 L0 10 Z" fill="#18181b"/>
    <line x1="0" y1="10" x2="0" y2="15" stroke="#18181b" stroke-width="1.5"/>
    <path d="M-6 15 Q0 18 6 15" stroke="#18181b" stroke-width="1.5" fill="none"/>

    <!-- Piercing Amber Eyes -->
    <ellipse cx="-11" cy="-2" rx="4.5" ry="3.5" fill="#facc15" stroke="#18181b" stroke-width="1.5"/>
    <ellipse cx="11" cy="-2" rx="4.5" ry="3.5" fill="#facc15" stroke="#18181b" stroke-width="1.5"/>
    <ellipse cx="-11" cy="-2" rx="1.8" ry="3" fill="#18181b"/>
    <ellipse cx="11" cy="-2" rx="1.8" ry="3" fill="#18181b"/>
    <circle cx="-12" cy="-3.5" r="1.2" fill="#ffffff"/>
    <circle cx="10" cy="-3.5" r="1.2" fill="#ffffff"/>

    <!-- Whiskers -->
    <path d="M-8 12 L-20 10 M-8 14 L-22 15 M8 12 L20 10 M8 14 L22 15" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
