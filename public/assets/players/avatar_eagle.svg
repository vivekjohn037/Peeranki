<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg-eagle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="beak-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow-eagle" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#34d399" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="64" cy="64" r="60" fill="url(#bg-eagle)" stroke="#34d399" stroke-width="3.5" filter="url(#glow-eagle)"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="#a7f3d0" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.75"/>

  <!-- Eagle Profile / Head -->
  <g transform="translate(64, 62)">
    <!-- Feather Crest -->
    <path d="M-10 -36 Q-2 -26 6 -24 Q-2 -22 -14 -18 Q-2 -16 8 -12" stroke="#f8fafc" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Head Feathers -->
    <path d="M-16 -24 Q-2 -30 14 -20 Q24 -10 24 6 Q24 24 4 34 Q-8 32 -18 20 Q-26 4 -22 -14 Z" fill="#f8fafc" stroke="#334155" stroke-width="2"/>

    <!-- Neck Shading / Dark Collar -->
    <path d="M-14 18 Q0 30 18 16 Q8 32 -8 34 Z" fill="#78350f" stroke="#451a03" stroke-width="1.5"/>

    <!-- Fierce Golden Brow & Eye -->
    <path d="M-8 -6 L6 -4" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="2" cy="0" rx="4.5" ry="4" fill="#fbbf24" stroke="#0f172a" stroke-width="1.2"/>
    <circle cx="2" cy="0" r="2.2" fill="#0f172a"/>
    <circle cx="1" cy="-1" r="1" fill="#ffffff"/>

    <!-- Curved Sharp Hooked Beak -->
    <path d="M12 -4 Q26 -2 32 8 Q34 16 28 22 Q26 24 24 20 Q22 14 10 12 Z" fill="url(#beak-gold)" stroke="#78350f" stroke-width="1.8"/>
    <!-- Nostril -->
    <ellipse cx="16" cy="2" rx="1.5" ry="0.8" fill="#78350f"/>

    <!-- Lower Beak Jaw -->
    <path d="M10 12 Q20 13 22 18 Q16 20 10 18 Z" fill="#d97706" stroke="#78350f" stroke-width="1.2"/>
  </g>
</svg>
